name: 빌드 & GitHub Pages 배포

on:
  push:
    branches: ['main', 'claude/number-blocks-2d-game-72b7ia']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 의존성 설치
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: 레벨 데이터가 생성기와 일치하는지 확인
        run: |
          python3 tools/gen_levels.py
          git diff --exit-code src/game/levels/data.ts
      - name: 타입 검사
        run: npm run typecheck
      - name: 테스트
        run: npm test
      - name: 빌드
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
