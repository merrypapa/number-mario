<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1830" />
    <meta name="description" content="넘버런: 카운트랜드 대모험 — 숫자 블록 캐릭터로 즐기는 2D 액션 플랫포머" />
    <title>넘버런: 카운트랜드 대모험</title>
    <style>
      :root {
        color-scheme: dark;
        --pad: rgba(255, 255, 255, 0.16);
        --pad-active: rgba(255, 216, 77, 0.5);
      }
      /* touch-action 은 상속되지 않으므로 모든 요소에 지정한다.
         (버튼을 연타할 때 브라우저가 더블탭 확대로 해석하는 것을 막는다) */
      * {
        box-sizing: border-box;
        touch-action: none;
      }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #070a14;
        font-family: "Trebuchet MS", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        color: #e6ecf7;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(40,60,120,0.35) 0%, transparent 60%),
          linear-gradient(180deg, #0d1428 0%, #070a14 100%);
      }
      canvas#game {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border-radius: 6px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        background: #0e1830;
      }
      /* 터치 컨트롤 */
      #touch {
        position: fixed;
        inset: 0;
        display: none;
        pointer-events: none;
      }
      body.touch #touch { display: block; }
      #touch .btn {
        position: absolute;
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--pad);
        border: 2px solid rgba(255, 255, 255, 0.28);
        color: #fff;
        font-size: 22px;
        font-weight: bold;
        backdrop-filter: blur(2px);
      }
      #touch .btn.active { background: var(--pad-active); transform: scale(0.94); }
      #btn-left   { left: 16px;  bottom: 22px; width: 64px; height: 64px; }
      #btn-right  { left: 92px;  bottom: 22px; width: 64px; height: 64px; }
      #btn-down   { left: 54px;  bottom: 96px; width: 56px; height: 56px; font-size: 18px; }
      #btn-jump   { right: 16px; bottom: 22px; width: 74px; height: 74px; }
      #btn-skill  { right: 98px; bottom: 40px; width: 64px; height: 64px; }
      #btn-pause  {
        right: 14px; top: 14px; width: 40px; height: 40px;
        font-size: 15px; border-radius: 10px;
      }
      @media (max-height: 420px) {
      </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="640" height="360" aria-label="넘버런 게임 화면"></canvas>
    </div>
    <div id="touch" aria-hidden="true">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-right">▶</div>
      <div class="btn" id="btn-down">▼</div>
      <div class="btn" id="btn-jump">▲</div>
      <div class="btn" id="btn-skill">★</div>
      <div class="btn" id="btn-pause">❚❚</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
