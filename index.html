<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1830" />
    <meta name="description" content="넘버런: 카운트랜드 대모험 — 숫자 블록 캐릭터로 즐기는 2D 액션 플랫포머" />
    <title>넘버런: 카운트랜드 대모험</title>
    <style>
      :root {
        color-scheme: dark;
        --pad: rgba(255, 255, 255, 0.16);
        --pad-active: rgba(255, 216, 77, 0.5);
      }
      /* touch-action 은 상속되지 않으므로 모든 요소에 지정한다.
         (버튼을 연타할 때 브라우저가 더블탭 확대로 해석하는 것을 막는다) */
      * {
        box-sizing: border-box;
        touch-action: none;
      }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #070a14;
        font-family: "Trebuchet MS", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        color: #e6ecf7;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(40,60,120,0.35) 0%, transparent 60%),
          linear-gradient(180deg, #0d1428 0%, #070a14 100%);
      }
      canvas#game {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border-radius: 6px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        background: #0e1830;
      }
      /* 터치 컨트롤 */
      #touch {
        position: fixed;
        inset: 0;
        display: none;
        pointer-events: none;
      }
      body.touch #touch { display: block; }
      #touch .btn {
        position: absolute;
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--pad);
        border: 2px solid rgba(255, 255, 255, 0.28);
        color: #fff;
        font-size: 22px;
        font-weight: bold;
        backdrop-filter: blur(2px);
      }
      #touch .btn.active { background: var(--pad-active); transform: scale(0.94); }
      #btn-left   { left: 16px;  bottom: 22px; width: 64px; height: 64px; }
      #btn-right  { left: 92px;  bottom: 22px; width: 64px; height: 64px; }
      #btn-down   { left: 54px;  bottom: 96px; width: 56px; height: 56px; font-size: 18px; }
      #btn-jump   { right: 16px; bottom: 22px; width: 74px; height: 74px; }
      #btn-skill  { right: 98px; bottom: 40px; width: 64px; height: 64px; }
      #btn-pause  {
        right: 14px; top: 14px; width: 40px; height: 40px;
        font-size: 15px; border-radius: 10px;
      }
      /* 매직 넘버 버튼 — 데스크톱·모바일 모두 표시 */
      #helpers {
        /* HUD(위쪽)와 방향/점프 버튼(좌·우 아래) 사이의 빈 공간 */
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 10px;
        z-index: 5;
      }
      #btn-magic {
        font-family: inherit;
        font-size: 12px;
        font-weight: bold;
        color: #ffe98a;
        background: rgba(20, 24, 38, 0.82);
        border: 2px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        padding: 8px 13px;
        cursor: pointer;
        line-height: 1;
      }
      #btn-magic.on {
        color: #20232e;
        background: linear-gradient(90deg, #ffd84d, #8fe07f, #87dcff, #bd8bf5);
        border-color: #ffffff;
      }
      #btn-magic:focus-visible { outline: 3px solid #ffd84d; outline-offset: 2px; }
      /* 세로 화면에서는 아래쪽이 방향 버튼과 겹치므로 위쪽 여백으로 올린다 */
      @media (orientation: portrait) {
        #helpers { top: 12px; bottom: auto; }
      }
      @media (max-width: 480px) {
        #btn-magic { font-size: 11px; padding: 7px 10px; }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="640" height="360" aria-label="넘버런 게임 화면"></canvas>
    </div>
    <div id="helpers">
      <button id="btn-magic" type="button" aria-pressed="false" title="매직 넘버 (M) — 무적">✨ 매직 넘버</button>
    </div>
    <div id="touch" aria-hidden="true">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-right">▶</div>
      <div class="btn" id="btn-down">▼</div>
      <div class="btn" id="btn-jump">▲</div>
      <div class="btn" id="btn-skill">★</div>
      <div class="btn" id="btn-pause">❚❚</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
